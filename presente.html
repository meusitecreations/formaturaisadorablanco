<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#46482d"><title>Com carinho | Isadora Ruzzarin Blanco</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Italianno&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet"><style>:root{--olive:#46482d;--cream:#fbf8f1;--ink:#292821;--pink:#ef326d;--gold:#c7a66a}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;text-align:center;padding:25px;color:var(--ink);font-family:Montserrat,sans-serif;background:radial-gradient(ellipse at top,#fffefa,#eee8dc)}.card{width:min(100%,570px);padding:clamp(38px,8vw,68px) 28px;border:1px solid #d8cbb6;background:#fffdf8;box-shadow:0 18px 48px #39351c1a;position:relative}.card:before{content:"";position:absolute;inset:11px;border:1px solid #e5d9c5;pointer-events:none}.script{font:56px Italianno,cursive;color:var(--pink);margin:0}.kicker{text-transform:uppercase;letter-spacing:.24em;font-size:9px;color:#777650}.message{font:500 28px/1.45 Cormorant Garamond,serif;margin:22px auto;color:#403f30}.sub{font:400 14px/1.8 Cormorant Garamond,serif;color:#6a6658}.pix{margin:28px auto 10px;padding:19px;border:1px dashed #b7a77e;background:#fbf8ef;max-width:370px}.pix-label{font-size:9px;text-transform:uppercase;letter-spacing:.2em;color:#777264}.pix-value{font:500 22px Cormorant Garamond,serif;letter-spacing:.08em;margin:12px 0;word-break:break-all}.copy{border:0;background:var(--pink);color:white;padding:14px 22px;font:500 9px Montserrat,sans-serif;text-transform:uppercase;letter-spacing:.16em;cursor:pointer}.status{height:18px;font-size:11px;color:#777264;margin-top:10px}.back{display:inline-block;margin-top:25px;color:#55553a;text-decoration:none;font-size:9px;letter-spacing:.15em;text-transform:uppercase}.back:hover{color:var(--pink)}</style></head><body><main class="card"><div class="kicker">Um gesto de carinho</div><h1 class="script">Muito obrigada!</h1><p class="message">Sua presença será meu maior presente.</p><p class="sub">Mas, caso queira me presentear, deixo como sugestão meu PIX:</p><div class="pix"><div class="pix-label">Chave PIX</div><div class="pix-value" id="pix">01357803060</div><button class="copy" onclick="copiarPix()">Copiar chave PIX</button><div class="status" id="status" aria-live="polite"></div></div><a class="back" href="index.html">← Voltar ao convite</a></main><script>function copiarPix(){const t=document.getElementById('pix').textContent;navigator.clipboard.writeText(t).then(()=>document.getElementById('status').textContent='Chave PIX copiada!').catch(()=>document.getElementById('status').textContent='Selecione e copie a chave acima.');}</script></body></html>
